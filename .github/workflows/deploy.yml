name: Test, release and deploy Dictator

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run pytest
        run: uv run pytest

  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-group
    # Don't attempt deploy in a fork.
    if: github.repository == 'twohoursonelife/dictator' && github.ref_name == 'main'
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --build-arg DICTATOR_VERSION=${{ github.sha }} --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Sync Discord application commands
        run: flyctl ssh console --command "uv run -m dictator.sync_commands"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: twohoursonelife
          SENTRY_PROJECT: dictator
        with:
          environment: production
